<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parts | Ryloc Parts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/style.css">
  </head>
  <body class="bg-black text-white overflow-x-hidden">
    
    <div id="app"></div>

    <script type="module">
      import { renderNavbar, renderFooter, initLayout } from './src/components/layout.js';
      import { products } from './src/data/products.js';

      // Parse query params for filtering
      const urlParams = new URLSearchParams(window.location.search);
      const categoryFilter = urlParams.get('category');

      const filteredProducts = categoryFilter 
        ? products.filter(p => p.category === categoryFilter)
        : products;

      document.getElementById('app').innerHTML = `
        ${renderNavbar('parts')}
        
        <div class="pt-24 sm:pt-28 md:pt-32 pb-16 sm:pb-20 px-4 md:px-12 max-w-7xl mx-auto min-h-screen">
          <section id="page-review" data-review-slot="inner" class="review-inline-panel mb-8 w-full" aria-label="Review questions for shop"></section>
          <div class="flex flex-col sm:flex-row sm:justify-between sm:items-end gap-6 mb-10 sm:mb-16 border-b border-white/10 pb-6 sm:pb-8">
            <div>
              <h1 class="text-3xl sm:text-4xl md:text-5xl font-serif mb-2 sm:mb-4">${categoryFilter || 'All Parts'}</h1>
              <p class="text-gray-400 max-w-md text-sm sm:text-base">Precision engineered components for your classic Mercedes-Benz.</p>
            </div>
            <div class="flex flex-wrap items-center gap-3 sm:gap-4 text-sm">
              <span class="text-gray-500 w-full sm:w-auto">Filter:</span>
              <a href="/parts.html" class="min-h-[44px] flex items-center ${!categoryFilter ? 'text-white' : 'text-gray-400 hover:text-white'}">All</a>
              <a href="/parts.html?category=Full Assembly" class="min-h-[44px] flex items-center ${categoryFilter === 'Full Assembly' ? 'text-white' : 'text-gray-400 hover:text-white'}">Assemblies</a>
              <a href="/parts.html?category=Individual Boards" class="min-h-[44px] flex items-center ${categoryFilter === 'Individual Boards' ? 'text-white' : 'text-gray-400 hover:text-white'}">Boards</a>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-6 md:gap-x-8 gap-y-12 sm:gap-y-16">
            ${filteredProducts.map(product => `
              <div class="group relative">
                <div class="aspect-[4/3] overflow-hidden bg-gray-900 mb-6 relative">
                  <a href="/product.html?id=${product.id}" target="_blank">
                    <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105 opacity-90 group-hover:opacity-100">
                  </a>
                  ${product.installGuide ? `
                    <div class="absolute top-3 right-3 md:top-4 md:right-4 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity duration-300">
                      <a href="${product.installGuide}" target="_blank" class="bg-black/80 backdrop-blur text-xs uppercase tracking-widest px-3 py-2.5 min-h-[44px] flex items-center gap-2 hover:bg-mb-blue hover:text-black transition-colors touch-manipulation">
                        <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                        Install Guide
                      </a>
                    </div>
                  ` : ''}
                </div>
                
                <div class="flex justify-between items-start mb-2">
                  <h3 class="text-xl font-serif max-w-[70%]">
                    <a href="/product.html?id=${product.id}" target="_blank" class="hover:text-gray-300 transition-colors">${product.name}</a>
                  </h3>
                  <span class="text-lg font-medium">$${product.price.toFixed(2)}</span>
                </div>
                
                <p class="text-gray-500 text-sm mb-4 line-clamp-2">${product.description}</p>
                
                <div class="flex justify-between items-center border-t border-white/10 pt-4 mt-4 gap-4">
                  <span class="text-xs uppercase tracking-widest text-gray-500">${product.category}</span>
                  <button onclick="window.addToCart(${product.id})" class="text-xs uppercase tracking-widest font-bold hover:text-mb-blue transition-colors flex items-center gap-2 min-h-[44px] px-3 -mx-3 touch-manipulation add-to-cart-btn">
                    Add to Cart
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                  </button>
                </div>
              </div>
            `).join('')}
          </div>

          ${filteredProducts.length === 0 ? `
            <div class="text-center py-20">
              <h3 class="text-2xl font-serif mb-4">No parts found</h3>
              <p class="text-gray-400">Try selecting a different category or check back later.</p>
              <a href="/parts.html" class="inline-block mt-6 border-b border-white pb-1">View All Parts</a>
            </div>
          ` : ''}
        </div>

        ${renderFooter()}
      `;

      initLayout();
    </script>
    <div id="review-root"></div>
    <script type="module" src="/src/review-bootstrap.tsx"></script>
  </body>
</html>
