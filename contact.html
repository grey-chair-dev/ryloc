<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | Ryloc Parts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/style.css">
  </head>
  <body class="bg-black text-white overflow-x-hidden">
    
    <div id="app"></div>

    <script type="module">
      import { renderNavbar, renderFooter, initLayout } from './src/components/layout.js';

      document.getElementById('app').innerHTML = `
        ${renderNavbar('contact')}
        
        <div class="pt-24 sm:pt-28 md:pt-32 pb-16 sm:pb-20 px-4 md:px-12 max-w-7xl mx-auto min-h-screen flex flex-col items-center">
          <section id="page-review" data-review-slot="inner" class="review-inline-panel w-full max-w-2xl mb-6" aria-label="Review questions for this page"></section>
          <section id="contact-review" data-review-slot="inner" class="review-inline-panel w-full max-w-2xl mb-8" aria-label="Review questions for Contact"></section>
          <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-serif mb-4 sm:mb-6 text-center">Contact Us</h1>
          <p class="text-gray-400 mb-8 sm:mb-12 text-center max-w-xl text-sm sm:text-base">
            Questions about fitment? Need help with an order? We're here to help keep your classic running.
          </p>
          
          <div id="form" class="w-full max-w-2xl bg-mb-dark-grey p-6 sm:p-8 md:p-12 rounded border border-white/10 shadow-2xl">
            <form class="space-y-5 sm:space-y-6">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-6">
                <div>
                  <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">First Name</label>
                  <input type="text" class="w-full bg-black/50 border border-white/10 px-4 py-3.5 min-h-[44px] text-white focus:border-mb-blue focus:outline-none transition-colors">
                </div>
                <div>
                  <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Last Name</label>
                  <input type="text" class="w-full bg-black/50 border border-white/10 px-4 py-3.5 min-h-[44px] text-white focus:border-mb-blue focus:outline-none transition-colors">
                </div>
              </div>
              
              <div>
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Email Address</label>
                <input type="email" class="w-full bg-black/50 border border-white/10 px-4 py-3.5 min-h-[44px] text-white focus:border-mb-blue focus:outline-none transition-colors">
              </div>

              <div>
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Message</label>
                <textarea rows="5" class="w-full bg-black/50 border border-white/10 px-4 py-3.5 min-h-[120px] text-white focus:border-mb-blue focus:outline-none transition-colors"></textarea>
              </div>

              <button type="submit" class="w-full btn-primary min-h-[48px]">Send Message</button>
            </form>
            
            <div id="info" class="mt-8 pt-8 border-t border-white/10 text-center text-sm text-gray-400">
              <p>Or email us directly at <a href="mailto:contact@rylocparts.com" class="text-white hover:text-mb-blue transition-colors">contact@rylocparts.com</a></p>
            </div>
          </div>
        </div>

        ${renderFooter()}
      `;

      initLayout();
    </script>
    <div id="review-root"></div>
    <script type="module" src="/src/review-bootstrap.tsx"></script>
  </body>
</html>
